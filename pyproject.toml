[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdp-gate-dataco"
version = "0.1.0"
description = "A combined-feature leakage check for bdp-model-gate, motivated by a real leaky benchmark in the DataCo supply chain dataset."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "chaqBD" }]
keywords = ["ml", "governance", "data-leakage", "mlops", "bdp-model-gate", "supply-chain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "bdp-model-gate>=0.6.0,<0.7.0",
    "numpy>=1.23,<3.0",
    "pandas>=1.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]
demo = [
    "scikit-learn>=1.2,<2.0",
]

# This is the plugin contract documented in bdp_model_gate's README
# ("Extending with plugins"): once this package is installed alongside
# bdp-model-gate, default_structured_checks() discovers the check below
# automatically, with no other wiring.
[project.entry-points."bdp_model_gate.checks"]
combined_feature_leakage = "bdp_gate_dataco.checks:CombinedFeatureLeakageCheck"

[project.urls]
Repository = "https://github.com/chaqBD/bdp-gate-DataCo"
Upstream = "https://github.com/vanjy-eng/model-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
